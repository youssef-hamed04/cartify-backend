# Render Blueprint: the Cartify API on the free plan, without the AI services (test deployment).
# Render dashboard → New → Blueprint → pick this repo. Values marked `sync: false` are asked for
# once in the dashboard (secrets never live in this file).
#
# What is off in this deployment, and what still works:
#   - Ask Cartify (Ollama LLM): not available on free hosting; the chat says so.
#   - Demand forecasting (ai-service): not deployed; the forecasting page shows the service as unreachable.
#   - SmartBox photo check (CLIP): AI_VERIFY=off (512 MB RAM is not enough); photos are still stored.
#   - Real estate price estimates still work: without the ai-service they come from comparable records.
# To add the forecasting service later, see the cartify-ai example at the end of this file.
services:
  - type: web
    name: cartify-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: OLLAMA_WARMUP
        value: "off"
      - key: AI_VERIFY
        value: "off"
      - key: ALLOWED_ORIGINS       # the Vercel site, e.g. https://cartify-xxxx.vercel.app
        sync: false
      - key: DB_URL                # MongoDB Atlas connection string
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DEVICE_API_KEY        # must match the SmartBox (ESP32) firmware
        sync: false
      - key: EMAIL_SENDER
        sync: false
      - key: EMAIL_SENDER_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

